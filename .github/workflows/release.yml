name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ljmerza/misc-actions/actions/python-test@v2.4.3
        with:
          python-version: "3.12"
          requirements-file: requirements-dev.txt

  # A v1.2.3 tag must become `version: "1.2.3"` in config.yaml on main, because
  # the Home Assistant supervisor pulls <image>:<version> from that field.
  # There is no shared action for this; it is add-on specific.
  sync-addon-version:
    name: Sync add-on version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialise across tags so two releases cannot both push to main.
    concurrency:
      group: sync-addon-version
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true

      - name: Bump config.yaml to match the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Each attempt re-derives the edit from the current tip of main, so a
          # concurrent push to main is a plain retry rather than a rebase that
          # can conflict.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            sed -i "s/^version: .*/version: \"${VERSION}\"/" config.yaml

            if git diff --quiet -- config.yaml; then
              echo "config.yaml is already at ${VERSION}"
              exit 0
            fi

            git commit --quiet -m "Bump add-on version to ${VERSION}" -- config.yaml
            if git push origin HEAD:main; then
              echo "Pushed version ${VERSION} to main"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}/3), retrying against the new tip"
          done

          echo "::error::could not push the ${VERSION} bump to main after 3 attempts"
          exit 1

  build:
    name: Build and push image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      # The tag ref still carries the pre-bump version; sync-addon-version only
      # fixes main. Stamp it here so the build context matches the tag.
      - name: Stamp the tag version into config.yaml
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sed -i "s/^version: .*/version: \"${TAG#v}\"/" config.yaml

      # Not the reusable docker-release.yml: it tags releases `type=ref,event=tag`,
      # which would publish `:v1.2.3`. The HA supervisor pulls `<image>:<version>`
      # with no `v`, so the bare semver tag below is required.
      - uses: ljmerza/misc-actions/actions/docker-build-push@v2.4.3
        id: build
        with:
          image-name: ghcr.io/${{ github.repository }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - uses: ljmerza/misc-actions/actions/provenance-attest@v2.4.3
        with:
          image-name: ghcr.io/${{ github.repository }}
          digest: ${{ steps.build.outputs.digest }}
